[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-speed-homography"
version = "1.0.0"
description = "Vehicle speed estimation from traffic video: YOLO detection, ByteTrack tracking and homography-based perspective correction"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oluwatomisin Isogun" }]
requires-python = ">=3.9"
dependencies = [
  "supervision==0.25.1", "ultralytics>=8.1", "opencv-python>=4.8", "numpy>=1.24",
  "pandas>=2.0", "matplotlib>=3.7", "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src"]
